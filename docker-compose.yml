services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: mapa
      POSTGRES_PASSWORD: mapa
      POSTGRES_DB: mapa_cultural
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/sql:/docker-entrypoint-initdb.d:ro
    ports: ["5432:5432"]

  api:
    image: python:3.12-slim
    working_dir: /app
    volumes: ["./backend:/app"]
    env_file: .env
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on: [db]
    ports: ["8000:8000"]

  web:
    image: node:20-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    env_file: .env
    command: sh -c "npm install && npm run dev"
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
