name: Manter o Supabase ativo

# O plano grátis do Supabase pausa o projeto após ~7 dias sem uso.
# Este job faz uma consulta pública por dia para ele não pausar. Não usa nenhum segredo.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar o banco
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable_Ht4Nn35DbazdDsQ1TLOcAQ_RdOQuPRu" \
            "https://xzapghpkyrxbyhbrlppi.supabase.co/rest/v1/mc_publicados?select=id&limit=1")
          echo "Resposta do Supabase: $code"
          test "$code" = "200"
