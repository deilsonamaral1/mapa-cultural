name: Backup do banco (criptografado)

# Toda segunda-feira exporta os dados do Supabase para um arquivo CRIPTOGRAFADO, guardado 90 dias
# em Actions > (execução) > Artifacts. Como este repositório é público, o arquivo só abre com a senha
# BACKUP_PASSPHRASE. Precisa de dois segredos do repositório (Settings > Secrets and variables > Actions):
#   SUPABASE_SERVICE_KEY  (chave secreta do Supabase; só existe aqui, nunca no código)
#   BACKUP_PASSPHRASE     (uma senha longa que você inventa e guarda)
on:
  schedule:
    - cron: "40 6 * * 1"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://xzapghpkyrxbyhbrlppi.supabase.co
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - name: Conferir segredos
        id: check
        run: |
          if [ -z "$SUPABASE_SERVICE_KEY" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::warning::Backup não feito: crie os segredos SUPABASE_SERVICE_KEY e BACKUP_PASSPHRASE (veja o README)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 20
      - name: Exportar e criptografar
        if: steps.check.outputs.ok == 'true'
        run: |
          node scripts/backup.mjs backup.json
          gzip -9 backup.json
          openssl enc -aes-256-cbc -pbkdf2 -salt -in backup.json.gz -out "backup-$(date +%F).json.gz.enc" -pass env:BACKUP_PASSPHRASE
          rm backup.json.gz
          ls -l
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.ok == 'true'
        with:
          name: backup-criptografado
          path: backup-*.json.gz.enc
          retention-days: 90
