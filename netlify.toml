[build]
  base = "frontend"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Proxy para as APIs públicas dos Mapas Culturais oficiais.
# O navegador chama /proxy/... no próprio site (mesma origem), então não há bloqueio de CORS.
[[redirects]]
  from = "/proxy/aquiraz/*"
  to = "https://mapacultural.aquiraz.ce.gov.br/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/proxy/estado/*"
  to = "https://mapacultural.secult.ce.gov.br/:splat"
  status = 200
  force = true

# O service worker precisa ser sempre revalidado para as atualizações chegarem.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Respostas dos mapas oficiais podem ser reaproveitadas por alguns minutos (site mais rápido, menos carga neles).
[[headers]]
  for = "/proxy/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=3600"

# Cópia por alguns minutos na rede da Netlify: o mapa oficial é consultado menos vezes e a página abre mais rápido.
[[headers]]
  for = "/proxy/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=900"
